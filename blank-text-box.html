<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Response Box</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: Arial, sans-serif;
        }

        .response-box {
            box-sizing: border-box;
            width: 100%;
            padding: 4px;
        }

        textarea {
            box-sizing: border-box;
            width: 100%;
            min-height: 120px;
            padding: 12px;

            border: 2px solid #b4dcff;
            border-radius: 6px;

            background-color: #fcfdff;
            color: #2d3b45;

            font-family: Arial, sans-serif;
            font-size: 1rem;
            line-height: 1.5;

            resize: vertical;
        }

        textarea:focus {
            border-color: #0055a5;
            outline: 3px solid rgba(0, 85, 165, 0.18);
        }
    </style>
</head>

<body>
    <div class="response-box">
        <textarea
            aria-label="Student response"
            placeholder="Write your response here..."
            spellcheck="true"
        ></textarea>
    </div>
</body>
</html>
