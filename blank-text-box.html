<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Reflection Activity</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: Arial, sans-serif;
            color: #2d3b45;
        }

        .text-box-widget {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #0055a5;
            font-size: 1rem;
            font-weight: bold;
            line-height: 1.4;
        }

        textarea {
            box-sizing: border-box;
            width: 100%;
            min-height: 110px;
            padding: 12px;
            border: 2px solid #b4dcff;
            border-radius: 6px;
            background-color: #fcfdff;
            color: #2d3b45;
            font-family: Arial, sans-serif;
            font-size: 1rem;
            line-height: 1.5;
            resize: vertical;
        }

        textarea:focus {
            border-color: #0055a5;
            outline: 3px solid rgba(0, 85, 165, 0.18);
        }

        .submit-button {
            margin-top: 10px;
            padding: 8px 18px;
            border: none;
            border-radius: 5px;
            background-color: #0055a5;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-button:hover {
            background-color: #003f7d;
        }

        .submit-button:focus {
            outline: 3px solid rgba(0, 85, 165, 0.25);
        }

        .feedback {
            display: none;
            box-sizing: border-box;
            margin-top: 12px;
            padding: 12px;
            border-left: 4px solid #0055a5;
            border-radius: 4px;
            background-color: #f2f8fd;
            color: #2d3b45;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .feedback-title {
            margin: 0 0 5px 0;
            color: #0055a5;
            font-weight: bold;
        }

        .feedback-text {
            margin: 0;
        }
    </style>
</head>

<body>
    <div class="text-box-widget">

        <label id="prompt-label" for="student-response">
            Write your answer here:
        </label>

        <textarea
            id="student-response"
            placeholder="Enter your response here..."
            spellcheck="true"
        ></textarea>

        <button
            class="submit-button"
            type="button"
            onclick="showFeedback()"
        >
            Submit
        </button>

        <div
            id="feedback"
            class="feedback"
            role="status"
            aria-live="polite"
        >
            <p class="feedback-title">Feedback</p>
            <p id="feedback-text" class="feedback-text"></p>
        </div>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search);

        const promptText =
            params.get("prompt") ||
            "Write your answer here:";

        const feedbackText =
            params.get("feedback") ||
            "Compare your response with the material above.";

        const placeholderText =
            params.get("placeholder") ||
            "Enter your response here...";

        document.getElementById("prompt-label").textContent = promptText;
        document.getElementById("feedback-text").textContent = feedbackText;
        document.getElementById("student-response").placeholder = placeholderText;

        function showFeedback() {
            const response = document.getElementById("student-response");
            const feedback = document.getElementById("feedback");

            if (response.value.trim() === "") {
                response.focus();
                return;
            }

            feedback.style.display = "block";
        }
    </script>
</body>
</html>
